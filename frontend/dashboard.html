<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LogiTrack WMS - Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        h1 { color: #333; }
        .section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #007bff; color: white; }
        button { padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <h1>📦 LogiTrack Dashboard (Stock Bajo < 10)</h1>
    <div class="section">
        <button onclick="cargarStockBajo()">Cargar Productos con Stock Bajo</button>
        <table>
            <thead>
                <tr><th>ID</th><th>Nombre</th><th>Categoría</th><th>Stock</th><th>Precio</th></tr>
            </thead>
            <tbody id="tabla-stock"></tbody>
        </table>
    </div>
    <script>
        async function cargarStockBajo() {
            const token = localStorage.getItem('token');
            const res = await fetch('http://localhost:8080/api/productos/stock-bajo', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) {
                const productos = await res.json();
                const tbody = document.getElementById('tabla-stock');
                tbody.innerHTML = '';
                productos.forEach(p => {
                    tbody.innerHTML += `<tr><td>${p.id}</td><td>${p.nombre}</td><td>${p.categoria}</td><td>${p.stock}</td><td>${p.precio}</td></tr>`;
                });
            } else {
                alert('No autorizado o sesión expirada');
            }
        }
    </script>
</body>
</html>
